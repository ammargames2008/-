name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        run: |
          mkdir work
          unzip -q "$(ls *.zip | head -1)" -d work
          cd work/MedTerms
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MedTerms-APK
          path: work/MedTerms/app/build/outputs/apk/debug/app-debug.apk
